name: Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    name: backend-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Run backend tests
        working-directory: backend
        run: ./mvnw -B test

  runner-tests:
    name: runner-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runner
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install pytest
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
      - name: Run runner tests
        run: |
          # Config comes from runner/pytest.ini. Exit code 5 means no tests were collected.
          code=0
          python -m pytest --strict-markers -m "not docker" || code=$?
          if [ "$code" -eq 5 ]; then
            echo "No runner tests collected yet; treating as success."
            exit 0
          fi
          exit "$code"

  frontend-tests:
    name: frontend-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Run frontend tests
        # node --test finds tests itself and exits 0 when there are none.
        working-directory: frontend
        run: node --test
