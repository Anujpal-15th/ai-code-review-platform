spring.application.name=backend
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mentorlens}
spring.datasource.username=${DB_USER:mentorlens}
spring.datasource.password=${DB_PASSWORD:}
# ponytail: ddl-auto=update, switch to Flyway migrations before production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# no default: startup fails if JWT_SECRET is unset
app.jwt-secret=${JWT_SECRET}
